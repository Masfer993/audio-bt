name: build
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: PhoneAudio/android
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneAudio-apk
          path: PhoneAudio/android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet publish PhoneAudio/windows/PhoneAudioReceiver -c Release -o out
      - uses: actions/upload-artifact@v4
        with: { name: PhoneAudioReceiver-exe, path: out/PhoneAudioReceiver.exe }
